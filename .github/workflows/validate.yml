# Läuft auf dem GitHub-Spiegel (nur main und Tags, siehe .gitlab-ci.yml).
# hassfest und die HACS-Prüfung gibt es nur als GitHub Action.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: Icon unter custom_components/coffeenord/brand/ fehlt noch.
          # license: PolyForm Noncommercial ist keine OSI-Lizenz. Das ist bewusst so,
          # darum gibt es die Integration nur als benutzerdefiniertes HACS-Repository.
          ignore: brands license
